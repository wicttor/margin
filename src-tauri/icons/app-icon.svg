  <rect x="283" y="91" width="27" height="802" fill="#e09aa0"/>
  <!-- Heading and text lines -->
  <rect x="391" y="236" width="363" height="67" rx="33.5" fill="#2b3448"/>
  <g fill="#b9c0cd">
    <rect x="391" y="398" width="363" height="40" rx="20"/>
    <rect x="391" y="492" width="296" height="40" rx="20"/>
    <rect x="391" y="586" width="363" height="40" rx="20"/>
    <rect x="391" y="681" width="162" height="40" rx="20"/>
  </g>
